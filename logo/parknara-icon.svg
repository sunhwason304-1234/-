<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2D27A"/><stop offset=".55" stop-color="#D4A83A"/><stop offset="1" stop-color="#9C7420"/>
  </linearGradient>
  <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8FA79B"/><stop offset=".45" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FA79B"/>
  </linearGradient>
</defs>

<rect width="512" height="512" rx="112" fill="#0E3B2C"/>
<rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#gold)" stroke-width="4" opacity=".7"/>
<g transform="translate(62 50) scale(2)"><g transform="skewX(-8) translate(18 0)">
  <!-- grip -->
  <path d="M63 16 h20 a5 5 0 0 1 5 5 v58 l-3 5 h-24 l-3 -5 v-58 a5 5 0 0 1 5 -5z" fill="#FFFFFF"/>
