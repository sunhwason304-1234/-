  <!-- club head -->
  <path d="M50 158 h58 c10 0 16 4 18 10 l2 8 c1 6 -3 10 -10 10 h-66 c-6 0 -9 -4 -9 -10 v-6 c0 -8 3 -12 7 -12z" fill="#FFFFFF"/>
  <path d="M58 180 h56" stroke="#D4A83A" stroke-width="3" stroke-linecap="round"/>
  <!-- swing arc = P bowl -->
  <path d="M96 30 H122 A48 48 0 0 1 122 126 H96" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="butt"/>
  <!-- ball -->
  <circle cx="122" cy="78" r="15" fill="#FFFFFF" stroke="#D4A83A" stroke-width="3"/>
  <g fill="#D4A83A" opacity=".45"><circle cx="116" cy="73" r="2"/><circle cx="125" cy="71" r="2"/><circle cx="120" cy="81" r="2"/><circle cx="129" cy="79" r="2"/><circle cx="124" cy="88" r="1.8"/></g>
</g></g>
</svg>
