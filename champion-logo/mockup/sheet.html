<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b0b0c;font-family:'Noto Sans CJK KR',sans-serif;color:#ddd}
.wrap{width:2400px;height:1700px;display:grid;grid-template-columns:1200px 1200px;grid-template-rows:100px 1600px}
.top{grid-column:1/3;display:flex;align-items:flex-end;justify-content:space-between;padding:0 50px 18px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.12em;color:#d9b45a}
.sub{font-size:18px;color:#8d8d8d}
.hero{position:relative;overflow:hidden;height:1600px}
.hero img{width:1280px;position:absolute;left:-40px;top:-2px}
.right{display:grid;grid-template-rows:750px 850px;height:1600px}
.close{height:750px}.head{height:850px}
.cell{position:relative;overflow:hidden}
.close img{width:1200px;height:750px;object-fit:cover}
.head img{width:1200px;height:900px;object-fit:cover;position:absolute;top:-30px;left:0}
.tag{position:absolute;left:28px;bottom:24px;background:rgba(0,0,0,.55);border:1px solid rgba(217,180,90,.5);
 color:#e9c766;font-size:19px;padding:8px 16px;border-radius:4px;letter-spacing:.04em}
.lbl{position:absolute;top:36px;font-size:22px;color:#e9c766;letter-spacing:.06em;background:rgba(0,0,0,.55);border:1px solid rgba(217,180,90,.5);padding:8px 18px;border-radius:4px}
</style></head><body><div class="wrap">
<div class="top"><h1>CHAMPION · 파크골프 샤프트 목업</h1><div class="sub">샤프트 디자인 33.6 × 388 mm 적용 · 블랙 골드 / 펄 골드</div></div>
<div class="hero cell"><img src="mockup_hero.png">
 <div class="lbl" style="left:230px">A · 블랙 골드</div><div class="lbl" style="left:620px">B · 펄 골드</div></div>
<div class="right">
 <div class="cell close"><img src="mockup_closeup.png"><div class="tag">샤프트 로고 클로즈업</div></div>
 <div class="cell head"><img src="mockup_head.png"><div class="tag">헤드 · 골드 호젤 · 상단 CHAMPION 로고</div></div>
</div></div></body></html>
